# This yml is used by these pipelines:
# - dotnet-sdk-public-ci
#   https://dev.azure.com/dnceng-public/public/_build?definitionId=101
#   Triggers: CI batch and PR

trigger:
  batch: true
  branches:
    include:
    - main

pr:
  branches:
    include:
    - main
    - release/*
    - internal/release/*
  paths:
    include:
    - eng
    - build
    - src
    - template_feed
    - test
    - .config
    - '*.yml'
    - '*.props'
    - '*.targets'
    - global.json
    exclude:
    - .github/workflows/**
    - .github/ISSUE_TEMPLATE/*
    - documentation/*
    - README.md
    - CODEOWNERS
    - .vsts-dnup-ci.yml
    - .vsts-dnup-pr.yml
    - dotnetup.slnf
    - /eng/pipelines/templates/jobs/dotnetup/*
    - src/Installer/*
    - test/dotnetup.Tests/*

variables:
- template: /eng/pipelines/templates/variables/sdk-defaults.yml
# Variables used: DncEngPublicBuildPool
- template: /eng/common/templates/variables/pool-providers.yml
- name: DOTNET_CLI_TELEMETRY_SESSIONID
  value: azdo-$(System.CollectionId)-$(System.TeamProjectId)-$(Build.BuildId)

resources:
  containers:
  - container: azureLinux30Amd64
    image: mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net11.0-build-amd64
  # Cross-compilation prereq image (clang + /crossrootfs/arm64 sysroot) used by the Linux arm64
  # AOT leg. NativeAOT cross-links dotnet-aot for linux-arm64 from an x64 host; the container
  # provides the native toolchain + sysroot and sets ROOTFS_DIR, and the leg passes
  # /p:CrossBuild=true so ILC emits --sysroot/--target.
  - container: azureLinuxCrossArm64
    image: mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net11.0-cross-arm64
    env:
      ROOTFS_DIR: /crossrootfs/arm64

stages:
############### BUILD STAGE ###############
- stage: build
  displayName: Build
  jobs:
  ############### HELIX JOB MONITOR ###############
  - template: /eng/common/core-templates/job/helix-job-monitor.yml
    parameters:
      useFullyQualifiedTestName: true

  ############### WINDOWS ###############
  - template: /eng/pipelines/templates/jobs/sdk-job-matrix.yml@self
    parameters:
      pool:
        name: $(DncEngPublicBuildPool)
        demands: ImageOverride -equals windows.vs2026.amd64.open
        os: windows
      helixTargetQueue: windows.amd64.vs2026.pre.scout.open

  ############### LINUX ###############
  - template: /eng/pipelines/templates/jobs/sdk-job-matrix.yml
    parameters:
      pool:
        name: $(DncEngPublicBuildPool)
        demands: ImageOverride -equals build.azurelinux.3.amd64.open
        os: linux
      helixTargetQueue: ubuntu.2204.amd64.open

  ############### MACOS ###############
  - template: /eng/pipelines/templates/jobs/sdk-job-matrix.yml
    parameters:
      pool:
        name: Azure Pipelines
        vmImage: macOS-latest
        os: macOS
      helixTargetQueue: osx.15.arm64.open
  ### x64 (CI only) ###
  - ${{ if ne(variables['Build.Reason'], 'PullRequest') }}:
    - template: /eng/pipelines/templates/jobs/sdk-job-matrix.yml
      parameters:
        pool:
          name: Azure Pipelines
          vmImage: macOS-latest
          os: macOS
        helixTargetQueue: osx.15.amd64.open
        macOSJobParameterSets:
        - runtimeIdentifier: osx-x64

