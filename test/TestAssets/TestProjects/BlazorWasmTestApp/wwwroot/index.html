<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blazor browser tests</title>
    <base href="/" />
</head>
<body>
    <div id="app">Loading...</div>
    <script>
        globalThis.browserWasmTest ??= {
            getArguments: () => globalThis.__mtpBrowserArguments ?? [],
            setResult: exitCode => {
                globalThis.__mtpBrowserResult = {
                    completed: true,
                    exitCode
                };
            }
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
