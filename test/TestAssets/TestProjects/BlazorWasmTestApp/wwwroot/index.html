<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blazor browser tests</title>
    <base href="/" />
</head>
<body>
    <div id="app">Loading...</div>
    <script>
        globalThis.browserWasmTest ??= {
            getContractVersion: () => globalThis.testingPlatformBrowser?.contractVersion ?? 0,
            getArguments: () => globalThis.testingPlatformBrowser.getArguments(),
            setResult: exitCode => globalThis.testingPlatformBrowser.complete(exitCode),
            reportFatalError: message => globalThis.testingPlatformBrowser.reportFatalError(message)
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
