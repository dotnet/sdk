trigger: none
pr: none

parameters:
- name: BARBuildId
  displayName: BAR ID of the signed official dotnetup build
  type: number
  default: 0

variables:
- template: /eng/common/templates-official/variables/pool-providers.yml
- name: DOTNET_CLI_TELEMETRY_SESSIONID
  value: azdo-$(System.CollectionId)-$(System.TeamProjectId)-$(Build.BuildId)
- name: DOTNET_ADD_GLOBAL_TOOLS_TO_PATH
  value: 0
- name: ReleaseMetadataDirectory
  value: $(Build.ArtifactStagingDirectory)/release-metadata
- name: ReleaseStagingDirectory
  value: $(Agent.TempDirectory)/dotnetup-cdn-staging
- name: ReleaseToolsDirectory
  value: $(Pipeline.Workspace)/dotnetup-release-tools
- name: ESRPOwners
  value: noahgilson@microsoft.com,marcpop@microsoft.com
- name: ESRPApprovers
  value: noahgilson@microsoft.com,daplaist@microsoft.com,marcpop@microsoft.com,jorobich@microsoft.com

resources:
  repositories:
  - repository: MicroBuildTemplates
    type: git
    name: 1ESPipelineTemplates/MicroBuildTemplate
    ref: refs/tags/release

extends:
  template: azure-pipelines/1ES.Official.Publish.yml@MicroBuildTemplates
  parameters:
    pool:
      name: $(DncEngInternalBuildPool)
      image: 1es-windows-2022
      os: windows
    stages:
    - stage: PublishToESRP
      displayName: Publish dotnetup to the CDN
      jobs:
      - job: Prepare
        displayName: Validate and stage the signed release
        templateContext:
          mb:
            publish:
              enabled: false
          outputs:
          - output: pipelineArtifact
            targetPath: $(ReleaseStagingDirectory)
            artifactName: DotnetupCdnAssets
          - output: pipelineArtifact
            targetPath: $(ReleaseMetadataDirectory)
            artifactName: DotnetupReleaseInputs
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/eng/pipelines/dotnetup-publishing.ps1
            artifactName: DotnetupReleaseTools
        steps:
        - checkout: self
          fetchDepth: 1
          fetchTags: false

        - pwsh: |
            $ErrorActionPreference = 'Stop'
            New-Item -ItemType Directory -Path $env:RELEASEMETADATADIRECTORY -ErrorAction Stop | Out-Null
            ./eng/pipelines/dotnetup-publishing.tests.ps1
          displayName: Check release validation with offline fixtures

        - task: AzureCLI@2
          displayName: Resolve and validate the BAR build
          inputs:
            azureSubscription: 'Darc: Maestro Production'
            scriptType: pscore
            scriptLocation: inlineScript
            inlineScript: |
              $ErrorActionPreference = 'Stop'

              $barBuildId = [int]$env:BAR_BUILD_ID
              if ($barBuildId -le 0) {
                throw 'A positive BARBuildId is required.'
              }

              # Maestro's production application audience is also used by the Darc client.
              $buildJson = az rest --method get --resource 54c17f3d-7325-4eca-9db7-f090bfc765a8 `
                --url "https://maestro.dot.net/api/builds/$barBuildId`?api-version=2020-02-20" --output json

              if ($LASTEXITCODE -ne 0) {
                throw "Could not resolve BAR build $barBuildId."
              }

              $barBuild = $buildJson | ConvertFrom-Json
              $sourceBuildId = [int]$barBuild.azureDevOpsBuildId
              if ($sourceBuildId -le 0) {
                throw 'The BAR build has no Azure DevOps run ID.'
              }

              $headers = @{ Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN" }
              $sourceBuild = Invoke-RestMethod -Headers $headers -Uri "https://dev.azure.com/dnceng/internal/_apis/build/builds/$sourceBuildId`?api-version=7.1"

              . ./eng/pipelines/dotnetup-publishing.ps1

              $release = Get-DotnetupRelease -BARBuildId $barBuildId -BARBuild $barBuild -SourceBuild $sourceBuild
              $release | ConvertTo-Json -Depth 10 | Set-Content (Join-Path $env:RELEASEMETADATADIRECTORY 'release.json')
              $buildJson | Set-Content (Join-Path $env:RELEASEMETADATADIRECTORY 'bar-build.json')

              Write-Host "Selected dotnetup $($release.version), BAR $barBuildId, Azure DevOps run $sourceBuildId."
              Write-Host "##vso[task.setvariable variable=SourceBuildId]$sourceBuildId"
          env:
            BAR_BUILD_ID: ${{ parameters.BARBuildId }}
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)

        - task: DownloadBuildArtifacts@1
          displayName: Download the signed build's blob artifacts
          inputs:
            buildType: specific
            project: internal
            pipeline: 1544
            buildVersionToDownload: specific
            buildId: $(SourceBuildId)
            downloadType: single
            artifactName: BlobArtifacts
            downloadPath: $(Agent.TempDirectory)/dotnetup-source
            checkDownloadedFiles: true

        - pwsh: |
            $ErrorActionPreference = 'Stop'

            . ./eng/pipelines/dotnetup-publishing.ps1

            $path = Join-Path $env:RELEASEMETADATADIRECTORY 'release.json'
            $release = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json -AsHashtable

            Copy-DotnetupReleaseAssets -Release $release `
              -SourceDirectory "$(Agent.TempDirectory)/dotnetup-source/BlobArtifacts" `
              -DestinationDirectory $env:RELEASESTAGINGDIRECTORY

            $release | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $path
          displayName: Verify checksums and signatures and stage release files

      - job: Publish
        displayName: Publish the prepared release through ESRP
        dependsOn: Prepare
        timeoutInMinutes: 180
        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            artifactName: DotnetupCdnAssets
            targetPath: $(ReleaseStagingDirectory)
          - input: pipelineArtifact
            artifactName: DotnetupReleaseInputs
            targetPath: $(ReleaseMetadataDirectory)
          - input: pipelineArtifact
            artifactName: DotnetupReleaseTools
            targetPath: $(ReleaseToolsDirectory)
          mb:
            publish:
              feedSource: https://pkgs.dev.azure.com/dnceng/_packaging/MicroBuildToolset/nuget/v3/index.json
        steps:
        - template: MicroBuild.Publish.ReleaseStudio.yml@MicroBuildTemplates
          parameters:
            intent: filedownloadlinkgeneration
            contentType: Binaries
            contentSource: Folder
            folderLocation: $(ReleaseStagingDirectory)
            waitForReleaseCompletion: true
            owners: $(ESRPOwners)
            approvers: $(ESRPApprovers)

        - pwsh: |
            $ErrorActionPreference = 'Stop'
            $env:ESRP_RELEASE_DETAILS | Set-Content (Join-Path $env:RELEASEMETADATADIRECTORY 'esrp-release-details.json')
          displayName: Retain the ESRP response, including failed releases
          condition: and(succeededOrFailed(), ne(variables['ESRP_RELEASE_DETAILS'], ''))
          env:
            ESRP_RELEASE_DETAILS: $(ESRP_RELEASE_DETAILS)

        - pwsh: |
            $ErrorActionPreference = 'Stop'

            . (Join-Path $env:RELEASETOOLSDIRECTORY 'dotnetup-publishing.ps1')
            if ([string]::IsNullOrWhiteSpace($env:ESRP_RELEASE_DETAILS)) {
              throw 'ESRP_RELEASE_DETAILS is missing or empty.'
            }

            $release = Get-Content (Join-Path $env:RELEASEMETADATADIRECTORY 'release.json') -Raw | ConvertFrom-Json -AsHashtable
            $details = $env:ESRP_RELEASE_DETAILS | ConvertFrom-Json

            $cdnRelease = Get-DotnetupCdnRelease -Release $release -Details $details `
              -DownloadDirectory "$(Agent.TempDirectory)/dotnetup-cdn-verification"
            $cdnRelease | ConvertTo-Json -Depth 10 | Set-Content (Join-Path $env:RELEASEMETADATADIRECTORY 'cdn-release.json')

            foreach ($file in $cdnRelease.files) {
              Write-Host "$($file.name): $($file.downloadUrl)"
            }

            Write-Host 'CDN files verified. No aka.ms links were changed.'
          displayName: Verify CDN downloads and record release URLs
          env:
            ESRP_RELEASE_DETAILS: $(ESRP_RELEASE_DETAILS)

        - task: 1ES.PublishPipelineArtifact@1
          displayName: Retain release metadata and ESRP results
          condition: always()
          inputs:
            targetPath: $(ReleaseMetadataDirectory)
            artifactName: DotnetupCdnRelease
