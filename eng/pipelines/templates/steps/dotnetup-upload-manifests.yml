steps:
- task: 1ES.PublishPipelineArtifact@1
  name: PublishCandidateAssetManifests
  displayName: '🗂️ Publish complete manifest and candidate ID allowlists'
  inputs:
    targetPath: '$(Build.StagingDirectory)/AssetManifests'
    artifactName: AssetManifests
    isProduction: false
- task: 1ES.PublishPipelineArtifact@1
  name: PublishCandidateReleaseConfig
  displayName: '🧾 Publish release configuration'
  inputs:
    targetPath: '$(Build.StagingDirectory)/ReleaseConfigs'
    artifactName: ReleaseConfigs
    isProduction: false
