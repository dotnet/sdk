parameters:
  runTestBuild: false

steps:
- template: /eng/common/core-templates/post-build/setup-maestro-vars.yml
  parameters:
    BARBuildId: $(BARBuildId)
    PromoteToChannelIds: ''
    is1ESPipeline: true
# Match the Darc prerequisite in Arcade's publish-build-assets.yml.
- task: UseDotNet@2
  name: InstallDarcSdk
  displayName: '🛠️ Install .NET 8 SDK for Darc'
  inputs:
    version: 8.0.x
- ${{ if eq(parameters.runTestBuild, true) }}:
  - powershell: |
      $parameters = '/p:BuildQuality=daily /p:BlobAssetIdManifests=daily.blobids'
      Write-Host 'Test candidates are not production-signed. This command is diagnostic only; do not execute it for this BAR build.'
      $command = 'darc add-build-to-channel --id {0} --publishing-infra-version 3 ' +
          '--default-channels --source-branch main --bar-uri https://maestro.dot.net --ci --verbose ' +
          '--artifact-publishing-parameters ''{1}'''
      Write-Host ($command -f '$(BARBuildId)', $parameters)
    name: PreviewDailyCandidatePromotion
    displayName: '🧪 Print daily promotion command without credentials (not executed)'
- ${{ else }}:
  - task: AzureCLI@2
    name: PublishDailyCandidate
    displayName: '🚀 Publish daily candidate using Darc'
    inputs:
      azureSubscription: 'Darc: Maestro Production'
      scriptType: ps
      scriptLocation: inlineScript
      inlineScript: |
        & "$(Build.SourcesDirectory)/eng/common/post-build/publish-using-darc.ps1" `
        -BuildId $(BARBuildId) `
        -PublishingInfraVersion 3 `
        -AzdoToken '$(System.AccessToken)' `
        -WaitPublishingFinish true `
        -ArtifactsPublishingAdditionalParameters '/p:BuildQuality=daily /p:BlobAssetIdManifests=daily.blobids' `
        -runtimeSourceFeed https://ci.dot.net/internal `
        -runtimeSourceFeedKey '$(dotnetbuilds-internal-container-read-token-base64)'
