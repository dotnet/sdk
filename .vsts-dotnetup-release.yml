# Manual, read-only release rehearsal. There is intentionally no live-publishing switch.
trigger: none
pr: none

parameters:
- name: quality
  displayName: Candidate to promote (GA is a placeholder)
  type: string
  default: preview
  values:
  - preview
  - ga
- name: akaOwners
  type: string
  default: UNCONFIGURED
- name: akaActor
  type: string
  default: UNCONFIGURED
- name: akaGroupOwner
  type: string
  default: UNCONFIGURED

variables:
- name: DOTNET_CLI_TELEMETRY_SESSIONID
  value: azdo-$(System.CollectionId)-$(System.TeamProjectId)-$(Build.BuildId)
- template: /eng/common/templates-official/variables/pool-providers.yml

resources:
  repositories:
  - repository: 1esPipelines
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release
  pipelines:
  - pipeline: candidate
    source: dotnet-dnup-official-ci
    trigger: none

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    pool:
      name: $(DncEngInternalBuildPool)
      image: windows.vs2026.amd64
      os: windows
    stages:
    - stage: plan
      displayName: Preview or GA promotion (dry run)
      jobs:
      - job: release
        displayName: Validate candidates and print publication operations
        timeoutInMinutes: 30
        templateContext:
          type: releaseJob
          isProduction: false
          inputs:
          - input: pipelineArtifact
            pipeline: candidate
            artifactName: DotnetupReleaseTools
            targetPath: $(Pipeline.Workspace)/release-tools
          - input: pipelineArtifact
            pipeline: candidate
            artifactName: Dotnetup_Dotnetup_windows_x64
            targetPath: $(Pipeline.Workspace)/candidate/Dotnetup_Dotnetup_windows_x64
          - input: pipelineArtifact
            pipeline: candidate
            artifactName: Dotnetup_Dotnetup_windows_arm64
            targetPath: $(Pipeline.Workspace)/candidate/Dotnetup_Dotnetup_windows_arm64
          - input: pipelineArtifact
            pipeline: candidate
            artifactName: Dotnetup_Dotnetup_linux_x64_crossBuildLinuxX64
            targetPath: $(Pipeline.Workspace)/candidate/Dotnetup_Dotnetup_linux_x64_crossBuildLinuxX64
          - input: pipelineArtifact
            pipeline: candidate
            artifactName: Dotnetup_Dotnetup_linux_arm64_crossBuildLinuxArm64
            targetPath: $(Pipeline.Workspace)/candidate/Dotnetup_Dotnetup_linux_arm64_crossBuildLinuxArm64
          - input: pipelineArtifact
            pipeline: candidate
            artifactName: Dotnetup_Dotnetup_linux_x64_crossBuildMuslX64
            targetPath: $(Pipeline.Workspace)/candidate/Dotnetup_Dotnetup_linux_x64_crossBuildMuslX64
          - input: pipelineArtifact
            pipeline: candidate
            artifactName: Dotnetup_Dotnetup_linux_arm64_crossBuildMuslArm64
            targetPath: $(Pipeline.Workspace)/candidate/Dotnetup_Dotnetup_linux_arm64_crossBuildMuslArm64
          - input: pipelineArtifact
            pipeline: candidate
            artifactName: Dotnetup_Dotnetup_macOS_x64
            targetPath: $(Pipeline.Workspace)/candidate/Dotnetup_Dotnetup_macOS_x64
          - input: pipelineArtifact
            pipeline: candidate
            artifactName: Dotnetup_Dotnetup_macOS_arm64
            targetPath: $(Pipeline.Workspace)/candidate/Dotnetup_Dotnetup_macOS_arm64
        steps:
        - powershell: |
            $output = New-Item -ItemType Directory -Force "$(Build.ArtifactStagingDirectory)\release-plan"
            & "$(Pipeline.Workspace)\release-tools\dotnetup-release.exe" `
              "$(Pipeline.Workspace)\candidate" "$env:RELEASE_QUALITY" `
              "$(resources.pipeline.candidate.runID)" "$(resources.pipeline.candidate.sourceCommit)" `
              "$($output.FullName)\release-plan.json" "$env:AKA_OWNERS" "$env:AKA_ACTOR" "$env:AKA_GROUP_OWNER"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "##vso[task.uploadfile]$($output.FullName)\release-plan.json"
          displayName: Validate and print CDN and aka.ms write plan (no external writes)
          env:
            RELEASE_QUALITY: ${{ parameters.quality }}
            AKA_OWNERS: ${{ parameters.akaOwners }}
            AKA_ACTOR: ${{ parameters.akaActor }}
            AKA_GROUP_OWNER: ${{ parameters.akaGroupOwner }}
