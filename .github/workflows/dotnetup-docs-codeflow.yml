name: Dotnetup documentation codeflow

on:
  push:
    branches:
      - release/dnup
    paths:
      - documentation/dotnetup/**
      - documentation/general/dotnetup/**

permissions:
  contents: write
  pull-requests: write

env:
  DOTNET_CLI_TELEMETRY_SESSIONID: gha-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}

concurrency:
  group: dotnetup-docs-codeflow

jobs:
  sync:
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Sync dotnetup documentation
        shell: pwsh
        run: |
          $branch = 'merge/release-dnup-dotnetup-docs-to-main'
          $paths = @(
            'documentation/dotnetup'
            'documentation/general/dotnetup'
          )

          git fetch --no-tags origin $env:GITHUB_SHA
          git checkout -B $branch origin/main

          foreach ($path in $paths) {
            git rm -r --ignore-unmatch -- $path

            $sourcePath = git ls-tree -d --name-only $env:GITHUB_SHA -- $path
            if ($sourcePath) {
              git checkout $env:GITHUB_SHA -- $path
            }
          }

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'The dotnetup documentation is already synchronized.'
            exit 0
          }

          $title = '[automated] Sync dotnetup documentation from release/dnup to main'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m $title
          git push --force origin "HEAD:$branch"

          $prNumber = gh pr list --base main --head $branch --state open --json number --jq '.[0].number'
          if (-not $prNumber) {
            $body = @'
          This PR copies the dotnetup documentation from `release/dnup` to `main`.

          Only these paths are synchronized:

          - `documentation/dotnetup`
          - `documentation/general/dotnetup`

          Product code remains owned by `release/dnup`.
          '@
            gh pr create --base main --head $branch --title $title --body $body
          }
        env:
          GH_TOKEN: ${{ github.token }}
