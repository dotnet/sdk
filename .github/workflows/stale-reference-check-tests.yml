name: Test stale-reference workflow helpers

on:
  pull_request:
    paths:
      - '.github/stale-reference-check/**'
      - '.github/workflows/stale-reference-*'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_SESSIONID: gha-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: node --test .github/stale-reference-check/test/*.test.mjs
      - name: Verify native MCP protocol compatibility
        timeout-minutes: 5
        run: node .github/stale-reference-check/test/gateway-smoke.mjs
