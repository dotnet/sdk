name: Inter-branch merge workflow
on:
  push:
    branches:
      - main
      - release/**

permissions:
  contents: write
  pull-requests: write

env:
  DOTNET_CLI_TELEMETRY_SESSIONID: gha-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  Merge:
    uses: dotnet/arcade/.github/workflows/inter-branch-merge-base.yml@1249e0a0957c31232d1fd43b5a36cabba1722062 # main