name: Inter-branch merge workflow
on:
  push:
    branches:
      - main
      - release/**

permissions:
  contents: write
  pull-requests: write

env:
  DOTNET_CLI_TELEMETRY_SESSIONID: gha-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  Merge:
    uses: dotnet/arcade/.github/workflows/inter-branch-merge-base.yml@1c4a1644edd3811541f70371cd9494058ba29235 # main