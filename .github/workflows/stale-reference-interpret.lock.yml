          GH_AW_SAFE_OUTPUTS_CONFIG: "{\"missing_data\":{},\"missing_tool\":{},\"noop\":{\"max\":1,\"report-as-issue\":\"false\"},\"record-interpretations\":{\"description\":\"Queue a validated batch for recording after threat detection. First call prepare_interpretations successfully, then pass its receipt unchanged. This call queues recording; the downstream job revalidates source before recording.\",\"inputs\":{\"receipt\":{\"default\":null,\"description\":\"The exact 64-character receipt returned by prepare_interpretations. Never invent it or send the JSON payload here.\",\"required\":true,\"type\":\"string\"}}},\"report_incomplete\":{}}"
        with:
          script: |
