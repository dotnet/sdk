<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NativeAOT binary size explorer</title>
<style>
:root{color-scheme:dark;--bg:#0d1117;--panel:#161b22;--line:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;gap:20px;align-items:center;flex-wrap:wrap}
h1{font-size:20px;margin:0}.summary{color:var(--muted)}.controls{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
input{width:340px;max-width:46vw;background:#0d1117;border:1px solid var(--line);border-radius:6px;color:var(--text);padding:8px 10px}
button{background:#21262d;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 10px;cursor:pointer}button:hover{border-color:#8b949e}
#crumbs{padding:10px 24px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:auto}#crumbs button{border:0;background:none;padding:2px;color:var(--accent)}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;height:calc(100vh - 113px)}#chart{width:100%;height:100%;min-height:520px}
aside{border-left:1px solid var(--line);background:var(--panel);padding:18px;overflow:auto}aside h2{font-size:16px;margin:0 0 8px}.kind,.path{color:var(--muted)}
.metric{font-size:28px;font-weight:650;margin:12px 0 2px}.percent,.exclusive{color:var(--muted)}.exclusive{margin-bottom:18px}.path{overflow-wrap:anywhere}
.results,.instantiations,.retention,.opportunities,.dedup{border-top:1px solid var(--line);margin-top:18px;padding-top:12px}.result{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 0;background:none}.result small{color:var(--muted)}.section-title{font-weight:650;margin-bottom:6px}.section-note{color:var(--muted);font-size:12px;margin-bottom:6px}.retention-path{margin:8px 0 14px;padding-left:12px;border-left:2px solid var(--line)}.retention-step{padding:4px 0;overflow-wrap:anywhere}.retention-step small{display:block;color:var(--muted)}
svg{display:block}.tile{stroke:#0d1117;stroke-width:1;cursor:pointer;transition:filter .08s}.tile:hover,.tile:focus{filter:brightness(1.28);outline:none}.label{fill:white;pointer-events:none;text-shadow:0 1px 2px #000;font-weight:600}.sub{fill:#d0d7de;pointer-events:none;text-shadow:0 1px 2px #000}
@media(max-width:850px){main{grid-template-columns:1fr;height:auto}#chart{height:65vh}aside{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header><h1 id="title"></h1><div class="summary" id="summary"></div><div class="controls"><input id="search" type="search" placeholder="Search assembly, namespace, type, or member…"><button id="single-reason"></button><button id="up">Up one level</button></div></header>
<div id="crumbs"></div>
<main><svg id="chart" role="img" aria-label="NativeAOT binary size treemap"></svg><aside><h2 id="selected-name">Select an area</h2><div class="kind" id="selected-kind"></div><div class="metric" id="selected-size"></div><div class="percent" id="selected-percent"></div><div class="exclusive" id="selected-exclusive"></div><div class="path" id="selected-path"></div><div class="opportunities" id="opportunities"></div><div class="retention" id="retention"></div><div class="instantiations" id="instantiations"></div><div class="dedup" id="dedup"></div><div class="results" id="results"></div></aside></main>
<script id="size-data" type="application/json">__MSTAT_REPORT_DATA__</script>
<script>
"use strict";
const report=JSON.parse(document.getElementById("size-data").textContent),root=report.root;
const svg=document.getElementById("chart"),crumbs=document.getElementById("crumbs"),results=document.getElementById("results"),instantiations=document.getElementById("instantiations"),retention=document.getElementById("retention"),opportunities=document.getElementById("opportunities"),dedup=document.getElementById("dedup");
let current=root,selected=root,showSingleReason=false;
const fmt=n=>new Intl.NumberFormat(undefined,{style:"unit",unit:"byte",unitDisplay:"narrow",notation:n>999999?"compact":"standard",maximumFractionDigits:2}).format(n);
const colors=["#1f6feb","#238636","#9e6a03","#8957e5","#da3633","#2f81f7","#3fb950","#d29922","#bc8cff","#f85149","#39c5cf","#db6d28"];
function hash(s){let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}
function index(node,parent=null,path=[]){node.parent=parent;node.path=[...path,node.name];(node.children||[]).forEach(c=>index(c,node,node.path))}
index(root);
function descendants(n,out=[]){out.push(n);(n.children||[]).forEach(c=>descendants(c,out));return out}
const all=descendants(root),retainedSizeNodes=new Map();
for(const n of all)for(const id of n.retentionIds||[]){const matches=retainedSizeNodes.get(id)||[];matches.push(n);retainedSizeNodes.set(id,matches)}
const directRetentionEdges=new Map();
for(const edge of report.retention.directEdges){const edges=directRetentionEdges.get(edge.target)||[];edges.push(edge);directRetentionEdges.set(edge.target,edges)}
const incoming=n=>(n.retentionIds||[]).flatMap(id=>directRetentionEdges.get(id)||[]);
const singleReasonNodes=all.filter(n=>incoming(n).length===1).sort((a,b)=>(b.exclusiveSize||0)-(a.exclusiveSize||0));
function topAssembly(n){let p=n;while(p.parent&&p.parent!==root)p=p.parent;return p.name}
function split(items,x,y,w,h,out){if(!items.length)return;if(items.length===1){out.push({node:items[0],x,y,w,h});return}const total=items.reduce((s,n)=>s+n.size,0);let acc=0,cut=1,best=Infinity;for(let i=1;i<items.length;i++){acc+=items[i-1].size;const d=Math.abs(.5-acc/total);if(d<best){best=d;cut=i}}const a=items.slice(0,cut),b=items.slice(cut),sa=a.reduce((s,n)=>s+n.size,0),ratio=sa/total;if(w>=h){split(a,x,y,w*ratio,h,out);split(b,x+w*ratio,y,w*(1-ratio),h,out)}else{split(a,x,y,w,h*ratio,out);split(b,x,y+h*ratio,w,h*(1-ratio),out)}}
function layout(node,w,h){const out=[],items=(node.children||[]).filter(n=>n.size>0);if(node.exclusiveSize&&items.length){items.push({name:"<exclusive bytes>",kind:`${node.kind} physical bytes`,size:node.exclusiveSize,exclusiveSize:node.exclusiveSize,retentionIds:node.retentionIds,parent:node,path:[...node.path,"<exclusive bytes>"]})}items.sort((a,b)=>b.size-a.size);split(items,0,0,w,h,out);return out}
function render(){const r=svg.getBoundingClientRect(),w=Math.max(400,r.width),h=Math.max(400,r.height);svg.setAttribute("viewBox",`0 0 ${w} ${h}`);svg.replaceChildren();for(const box of layout(current,w,h)){const n=box.node,g=document.createElementNS("http://www.w3.org/2000/svg","g"),rect=document.createElementNS(g.namespaceURI,"rect");rect.setAttribute("class","tile");rect.setAttribute("x",box.x);rect.setAttribute("y",box.y);rect.setAttribute("width",Math.max(0,box.w));rect.setAttribute("height",Math.max(0,box.h));rect.setAttribute("rx","2");rect.setAttribute("fill",colors[hash(topAssembly(n))%colors.length]);rect.setAttribute("tabindex","0");const title=document.createElementNS(g.namespaceURI,"title");title.textContent=`${n.path.join(" › ")}\n${fmt(n.size)} total; ${fmt(n.exclusiveSize||0)} exclusive`;rect.append(title);const choose=()=>{selected=n;details();if(n.children?.length){current=n;render()}};rect.addEventListener("click",choose);rect.addEventListener("focus",()=>{selected=n;details()});rect.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();choose()}});g.append(rect);if(box.w>78&&box.h>34){const t=document.createElementNS(g.namespaceURI,"text");t.setAttribute("class","label");t.setAttribute("x",box.x+6);t.setAttribute("y",box.y+17);t.setAttribute("font-size",box.w>180?"13":"11");t.textContent=n.name.length>Math.floor(box.w/7)?n.name.slice(0,Math.max(3,Math.floor(box.w/7)-1))+"…":n.name;g.append(t);if(box.h>52){const s=document.createElementNS(g.namespaceURI,"text");s.setAttribute("class","sub");s.setAttribute("x",box.x+6);s.setAttribute("y",box.y+34);s.setAttribute("font-size","10");s.textContent=fmt(n.size);g.append(s)}}svg.append(g)}crumbs.replaceChildren();current.path.forEach((name,i)=>{const b=document.createElement("button");b.textContent=name;b.onclick=()=>{let n=current;while(n.path.length>i+1)n=n.parent;current=n;selected=n;render()};crumbs.append(b);if(i<current.path.length-1)crumbs.append(" › ")});details()}
function details(){document.getElementById("selected-name").textContent=selected.name;document.getElementById("selected-kind").textContent=selected.kind;document.getElementById("selected-size").textContent=fmt(selected.size);document.getElementById("selected-percent").textContent=`${(100*selected.size/root.size).toFixed(3)}% of attributed size`;document.getElementById("selected-exclusive").textContent=selected.exclusiveSize?`${fmt(selected.exclusiveSize)} belongs exclusively to this node.`:"Aggregate node; bytes belong to descendants.";document.getElementById("selected-path").textContent=selected.path.join(" › ");renderOpportunities();renderRetention();renderGenerics();renderDedup()}
function renderGenerics(){const genericNodes=descendants(selected,[]).filter(n=>n!==selected&&(n.kind==="type instantiation"||n.kind==="method instantiation")).sort((a,b)=>b.size-a.size);instantiations.replaceChildren();instantiations.style.display=genericNodes.length?"block":"none";if(!genericNodes.length)return;const title=document.createElement("div");title.className="section-title";title.textContent=`Generic instantiations (${genericNodes.length.toLocaleString()})`;instantiations.append(title);const note=document.createElement("div");note.className="section-note";note.textContent=genericNodes.length>500?"Showing the 500 largest; the CSV contains the complete inventory.":"__Canon denotes NativeAOT canonical code sharing.";instantiations.append(note);for(const n of genericNodes.slice(0,500))instantiations.append(nodeButton(n))}
function renderDedup(){dedup.replaceChildren();dedup.style.display=selected.deduplicatedWith?.length?"block":"none";if(!selected.deduplicatedWith?.length)return;const title=document.createElement("div");title.className="section-title";title.textContent=`Folded method bodies (${selected.deduplicatedWith.length.toLocaleString()})`;dedup.append(title);for(const name of selected.deduplicatedWith){const item=document.createElement("div");item.className="retention-step";item.textContent=name;dedup.append(item)}}
function renderRetention(){retention.replaceChildren();const title=document.createElement("div");title.className="section-title";title.textContent="Why is this kept?";retention.append(title);if(!selected.retentionIds?.length){const note=document.createElement("div");note.className="section-note";note.textContent="This is an aggregate or display-only node. Select a contained physical size node.";retention.append(note);return}const names=report.retention.nodes,parents=report.retention.rootParents,direct=incoming(selected).sort((a,b)=>(names[a.source]||"").localeCompare(names[b.source]||""));let best=[];for(const id of selected.retentionIds){const chain=[];let cursor=id,guard=0;while(parents[cursor]&&guard++<10000){const parent=parents[cursor];chain.push({source:parent.source,target:cursor,reason:parent.reason});cursor=parent.source}chain.reverse();if(chain.length&&(!best.length||chain.length<best.length))best=chain}const pathTitle=document.createElement("div");pathTitle.className="section-note";pathTitle.textContent=best.length?"One shortest path from an AOT root:":"This node is a root, is unreachable from a root, or has no path.";retention.append(pathTitle);if(best.length){const path=document.createElement("div");path.className="retention-path";for(const edge of best){const step=document.createElement("div");step.className="retention-step";step.append(retentionLink(edge.source,names[edge.source]||`Node ${edge.source}`));if(edge.reason){const reason=document.createElement("small");reason.textContent=edge.reason;step.append(reason)}path.append(step)}const leaf=document.createElement("div");leaf.className="retention-step";leaf.textContent=selected.name;path.append(leaf);retention.append(path)}const directTitle=document.createElement("div");directTitle.className="section-note";directTitle.textContent=`All direct incoming dependencies (${direct.length.toLocaleString()} across ${selected.retentionIds.length.toLocaleString()} graph node(s)):`;retention.append(directTitle);for(const edge of direct){const item=document.createElement("div");item.className="retention-step";item.append(retentionLink(edge.source,names[edge.source]||`Node ${edge.source}`));if(edge.reason){const reason=document.createElement("small");reason.textContent=edge.reason;item.append(reason)}retention.append(item)}}
function retentionLink(id,name){const match=retainedSizeNodes.get(id)?.[0];if(!match)return document.createTextNode(name);const link=document.createElement("button");link.className="result";link.style.padding="2px 0";link.textContent=name;link.onclick=e=>{e.stopPropagation();selected=match;current=match.parent||match;render()};return link}
function renderOpportunities(){opportunities.replaceChildren();opportunities.style.display=showSingleReason?"block":"none";if(!showSingleReason)return;const title=document.createElement("div");title.className="section-title";title.textContent=`Largest single-dependency nodes (${singleReasonNodes.length.toLocaleString()})`;opportunities.append(title);const note=document.createElement("div");note.className="section-note";note.textContent="Exactly one incoming graph edge, ranked by exclusive physical bytes. The CSV contains every candidate.";opportunities.append(note);for(const n of singleReasonNodes.slice(0,200)){const edge=incoming(n)[0],source=report.retention.nodes[edge.source]||`Node ${edge.source}`,b=nodeButton(n);b.querySelector("small").append(document.createElement("br"),`kept by ${source} · ${edge.reason||"unspecified edge"}`);opportunities.append(b)}}
function nodeButton(n){const b=document.createElement("button");b.className="result";const name=document.createTextNode(n.name),small=document.createElement("small");small.textContent=`${n.kind} · ${fmt(n.size)} total · ${fmt(n.exclusiveSize||0)} exclusive`;b.append(name,document.createElement("br"),small);b.onclick=()=>{showSingleReason=false;selected=n;current=n.parent||n;render()};return b}
document.getElementById("title").textContent=`${report.name} size explorer`;
document.getElementById("summary").textContent=`${fmt(report.attributedSize)} attributed by ILC · MSTAT ${report.mstatVersion} · ${all.length.toLocaleString()} nodes`;
document.getElementById("up").onclick=()=>{if(current.parent){current=current.parent;selected=current;render()}};
const singleReasonButton=document.getElementById("single-reason");singleReasonButton.textContent=`Single-dependency candidates (${singleReasonNodes.length.toLocaleString()})`;singleReasonButton.onclick=()=>{showSingleReason=!showSingleReason;selected=root;current=root;render()};
document.getElementById("search").addEventListener("input",e=>{const q=e.target.value.trim().toLowerCase();results.replaceChildren();if(q.length<2)return;for(const n of all.filter(n=>n.name.toLowerCase().includes(q)).sort((a,b)=>b.size-a.size).slice(0,100))results.append(nodeButton(n))});
new ResizeObserver(render).observe(svg);render();
</script>
</body>
</html>
