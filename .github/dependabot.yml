version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      github-actions:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    exclude-paths:
      # generated by gh-aw compile; never edit directly, update the source .md and recompile instead
      - ".github/workflows/*.lock.yml"
    ignore:
      # gh-aw-actions is updated by recompiling the agentic workflows, not by dependabot
      - dependency-name: "github/gh-aw-actions/**"
      - dependency-name: "github/gh-aw-actions"

  - package-ecosystem: "nuget"
    directory: "/eng/dependabot"
    open-pull-requests-limit: 10
    schedule:
      interval: "weekly"
    target-branch: "main"
    labels:
      - "dependencies"
      - "dependabot: main"
    ignore:
      # arcade and helix are updated by the automated codeflow process
      - dependency-name: "Microsoft.DotNet.Arcade.Sdk"
      - dependency-name: "Microsoft.DotNet.Helix.Sdk"
      - dependency-name: "Microsoft.DotNet.Helix.JobMonitor"

